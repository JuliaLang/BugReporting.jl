steps:
  - label: "Julia {{matrix.julia}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-test#v1: ~
    agents:
      # rr needs hardware performance counters, which the Julia cluster's
      # Linux test agents expose and GitHub-hosted runners do not.
      queue: "test"
      os: "linux"
      arch: "x86_64"
      sandbox_capable: "true"
      sched_cpus: "1"
      sched_cpus_limit: "4"
      sched_mem_gib: "2"
      sched_mem_limit_gib: "8"
    timeout_in_minutes: 15
    matrix:
      setup:
        julia:
          - "1.10"
          - "1"
          - "nightly"
      adjustments:
        - with:
            julia: "nightly"
          soft_fail: true
